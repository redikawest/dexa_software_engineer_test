name: dexa

services:
  postgres:
    image: postgres:17-alpine
    container_name: dexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dexa_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-dexa_main}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: migrate
    container_name: dexa-migrate
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-dexa}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dexa_dev_password}
      DB_NAME: ${POSTGRES_DB:-dexa_main}
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: ./backend
      args:
        SERVICE: api-gateway
    container_name: dexa-api-gateway
    restart: unless-stopped
    environment:
      GATEWAY_PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      EMPLOYEE_SERVICE_URL: http://employee-service:3002
    depends_on:
      auth-service:
        condition: service_healthy
      employee-service:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth-service:
    build:
      context: ./backend
      args:
        SERVICE: auth-service
    container_name: dexa-auth-service
    restart: unless-stopped
    environment:
      AUTH_SERVICE_PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-dexa}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dexa_dev_password}
      DB_NAME: ${POSTGRES_DB:-dexa_main}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  employee-service:
    build:
      context: ./backend
      args:
        SERVICE: employee-service
    container_name: dexa-employee-service
    restart: unless-stopped
    environment:
      EMPLOYEE_SERVICE_PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-dexa}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dexa_dev_password}
      DB_NAME: ${POSTGRES_DB:-dexa_main}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3002').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  attendance-service:
    build:
      context: ./backend
      args:
        SERVICE: attendance-service
    container_name: dexa-attendance-service
    restart: unless-stopped
    environment:
      ATTENDANCE_SERVICE_PORT: 3003
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3003').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
