name: dexa

services:
  postgres:
    image: postgres:17-alpine
    container_name: dexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dexa_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-dexa_main}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: migrate
    container_name: dexa-migrate
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-dexa}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dexa_dev_password}
      DB_NAME: ${POSTGRES_DB:-dexa_main}
      LOGS_DB_HOST: postgres
      LOGS_DB_PORT: 5432
      LOGS_DB_USER: ${LOGS_DB_USER:-dexa_logs}
      LOGS_DB_PASSWORD: ${LOGS_DB_PASSWORD:-dexa_logs_dev_password}
      LOGS_DB_NAME: ${LOGS_DB_NAME:-dexa_logs}
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: dexa-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dexa}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dexa_dev_password}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  api-gateway:
    build:
      context: ./backend
      args:
        SERVICE: api-gateway
    container_name: dexa-api-gateway
    restart: unless-stopped
    environment:
      GATEWAY_PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      EMPLOYEE_SERVICE_URL: http://employee-service:3002
      ATTENDANCE_SERVICE_URL: http://attendance-service:3003
      # Not a startup dependency: the gateway keeps working if the log-service is down.
      LOG_SERVICE_URL: http://log-service:3004
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
    volumes:
      - ./backend/keys/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      auth-service:
        condition: service_healthy
      employee-service:
        condition: service_healthy
      attendance-service:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth-service:
    build:
      context: ./backend
      args:
        SERVICE: auth-service
    container_name: dexa-auth-service
    restart: unless-stopped
    environment:
      AUTH_SERVICE_PORT: 3001
      # The service starts, and keeps working, even when the broker is down (see EventPublisher).
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-dexa}:${RABBITMQ_PASSWORD:-dexa_dev_password}@rabbitmq:5672
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-dexa}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dexa_dev_password}
      DB_NAME: ${POSTGRES_DB:-dexa_main}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend/keys/jwt-private.pem:/run/secrets/jwt-private.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(3001, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  employee-service:
    build:
      context: ./backend
      args:
        SERVICE: employee-service
    container_name: dexa-employee-service
    restart: unless-stopped
    environment:
      EMPLOYEE_SERVICE_PORT: 3002
      AUTH_SERVICE_URL: http://auth-service:3001
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-dexa}:${RABBITMQ_PASSWORD:-dexa_dev_password}@rabbitmq:5672
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-dexa}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dexa_dev_password}
      DB_NAME: ${POSTGRES_DB:-dexa_main}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(3002, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  log-service:
    build:
      context: ./backend
      args:
        SERVICE: log-service
    container_name: dexa-log-service
    restart: unless-stopped
    environment:
      LOG_SERVICE_PORT: 3004
      EMPLOYEE_SERVICE_URL: http://employee-service:3002
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-dexa}:${RABBITMQ_PASSWORD:-dexa_dev_password}@rabbitmq:5672
      LOGS_DB_HOST: postgres
      LOGS_DB_PORT: 5432
      LOGS_DB_USER: ${LOGS_DB_USER:-dexa_logs}
      LOGS_DB_PASSWORD: ${LOGS_DB_PASSWORD:-dexa_logs_dev_password}
      LOGS_DB_NAME: ${LOGS_DB_NAME:-dexa_logs}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(3004, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  attendance-service:
    build:
      context: ./backend
      args:
        SERVICE: attendance-service
    container_name: dexa-attendance-service
    restart: unless-stopped
    environment:
      ATTENDANCE_SERVICE_PORT: 3003
      EMPLOYEE_SERVICE_URL: http://employee-service:3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-dexa}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dexa_dev_password}
      DB_NAME: ${POSTGRES_DB:-dexa_main}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(3003, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  rabbitmq_data:
